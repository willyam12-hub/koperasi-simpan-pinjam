<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Anggota | KoperasiKu</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">K</div>

            <div>
                <strong>KoperasiKu</strong>
                <small>Simpan Pinjam</small>
            </div>
        </div>

        <nav class="nav">

            <a href="dashboard.html" data-page="dashboard">
                Dashboard
            </a>

            <div class="nav-title">
                DATA MASTER
            </div>

            <a href="data-master.html" data-page="anggota">
                Data Anggota
            </a>

            <div class="nav-title">
                TRANSAKSI
            </div>

            <a href="simpanan.html" data-page="simpanan">
                Simpanan
            </a>

            <a href="penarikan.html" data-page="penarikan">
                Penarikan
            </a>

            <a href="pinjaman.html" data-page="pinjaman">
                Pinjaman
            </a>

            <a href="angsuran.html" data-page="angsuran">
                Angsuran
            </a>

            <div class="nav-title">
                LAPORAN
            </div>

            <a href="laporan.html" data-page="laporan">
                Laporan
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="admin-box">

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Administrator</strong>
                    <small>Admin</small>
                </div>

            </div>

            <button
                type="button"
                class="logout-button"
                onclick="logout()">
                Keluar
            </button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <div>
                <span>PORTAL ADMIN</span>
                <h1>Form Anggota</h1>
            </div>

            <div
                class="date"
                id="today">
            </div>

        </header>


        <section class="content">

            <div class="panel narrow">

                <h2 id="formTitle">
                    Tambah Anggota
                </h2>

                <p class="muted">
                    Isi data anggota baru. Data akan langsung muncul pada modul transaksi.
                </p>


                <form
                    id="memberForm"
                    class="form-grid"
                    autocomplete="off">

                    <input
                        type="hidden"
                        id="memberId">


                    <label>
                        Nama Lengkap*

                        <input
                            type="text"
                            id="memberName"
                            required>
                    </label>


                    <label>
                        NIK

                        <input
                            type="text"
                            id="memberNik">
                    </label>


                    <label>
                        Nomor Telepon

                        <input
                            type="text"
                            id="memberPhone">
                    </label>


                    <label>
                        Status*

                        <select
                            id="memberStatus"
                            required>

                            <option value="Aktif">
                                Aktif
                            </option>

                            <option value="Nonaktif">
                                Nonaktif
                            </option>

                        </select>

                    </label>


                    <label class="full">
                        Alamat

                        <textarea
                            id="memberAddress"
                            rows="4"></textarea>
                    </label>


                    <label>
                        Tanggal Daftar*

                        <input
                            type="date"
                            id="memberDate"
                            required>

                    </label>


                    <div class="actions full">

                        <a
                            class="btn"
                            href="data-master.html">
                            Batal
                        </a>

                        <button
                            class="btn primary"
                            type="submit">
                            Simpan Anggota
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>


<!-- APP.JS DULU -->
<script src="../assets/js/app.js"></script>


<!-- BARU JALANKAN FUNGSI -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    protectPage();

    setToday();

    setActive("anggota");

    setDateValue("memberDate");


    const params =
        new URLSearchParams(
            window.location.search
        );

    const editId =
        Number(
            params.get("id") || 0
        );


    if (editId) {

        loadMemberForm(editId);

    }


    const form =
        document.getElementById(
            "memberForm"
        );


    if (form) {

        form.addEventListener(
            "submit",
            saveMember
        );

    }

});

</script>

</body>
</html>
