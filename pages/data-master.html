<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Data Anggota | KoperasiKu</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

</head>


<body>

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                K
            </div>

            <div>
                <strong>KoperasiKu</strong>
                <small>Simpan Pinjam</small>
            </div>

        </div>


        <nav class="nav">

            <a
                href="dashboard.html"
                data-page="dashboard">
                Dashboard
            </a>


            <div class="nav-title">
                DATA MASTER
            </div>


            <a
                href="data-master.html"
                data-page="anggota">
                Data Anggota
            </a>


            <div class="nav-title">
                TRANSAKSI
            </div>


            <a
                href="simpanan.html"
                data-page="simpanan">
                Simpanan
            </a>


            <a
                href="penarikan.html"
                data-page="penarikan">
                Penarikan
            </a>


            <a
                href="pinjaman.html"
                data-page="pinjaman">
                Pinjaman
            </a>


            <a
                href="angsuran.html"
                data-page="angsuran">
                Angsuran
            </a>


            <div class="nav-title">
                LAPORAN
            </div>


            <a
                href="laporan.html"
                data-page="laporan">
                Laporan
            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="admin-box">

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Administrator</strong>
                    <small>Admin</small>
                </div>

            </div>


            <button
                type="button"
                class="logout-button"
                onclick="logout()">

                Keluar

            </button>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <header class="topbar">

            <div>

                <span>
                    PORTAL ADMIN
                </span>

                <h1>
                    Data Anggota
                </h1>

            </div>


            <div
                class="date"
                id="today">
            </div>

        </header>



        <section class="content">


            <!-- TOOLBAR -->

            <div class="toolbar">

                <div>

                    <h2>
                        Data Anggota
                    </h2>

                    <p class="muted">
                        Kelola seluruh anggota koperasi.
                    </p>

                </div>


                <a
                    class="btn primary"
                    href="form.html">

                    + Tambah Anggota

                </a>

            </div>



            <!-- PANEL -->

            <div class="panel">


                <div class="search-row">

                    <input
                        type="text"
                        id="memberSearch"
                        placeholder="Cari nama, ID, NIK, atau telepon...">

                </div>



                <div class="table">

                    <table>

                        <thead>

                            <tr>

                                <th>No</th>
                                <th>ID Anggota</th>
                                <th>Nama</th>
                                <th>NIK</th>
                                <th>Telepon</th>
                                <th>Status</th>
                                <th>Saldo</th>
                                <th>Aksi</th>

                            </tr>

                        </thead>


                        <tbody id="memberTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>



<!-- APP.JS -->

<script src="../assets/js/app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        protectPage();

        setToday();

        setActive("anggota");

        renderMembers();


        const search =
            document.getElementById(
                "memberSearch"
            );


        if (search) {

            search.addEventListener(
                "input",
                function () {

                    renderMembers();

                }
            );

        }

    }
);

</script>


</body>

</html>
